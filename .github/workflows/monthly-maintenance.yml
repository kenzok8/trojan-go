name: monthly-maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 1 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  go-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Refresh Go modules
        run: |
          set -euo pipefail
          modules=$(python3 - <<'PY'
          import pathlib
          mods=[]
          inside=False
          for line in pathlib.Path('go.mod').read_text().splitlines():
              if line.strip()=='require (':
                  inside=True
                  continue
              if inside and line.strip()==')':
                  break
              if inside and line.strip() and '//' not in line:
                  mod=line.strip().split()[0]
                  mods.append(mod)
          print(' '.join(mods))
          PY
          )
          if [ -n "$modules" ]; then
            go get -u=patch $modules
          fi
          go mod tidy -go=1.27.0

      - name: Test
        run: |
          set -euo pipefail
          packages=$(go list ./... | grep -v '^github.com/kenzok8/trojan-go/test/scenario$' | grep -v '^github.com/kenzok8/trojan-go/tunnel/http$' | grep -v '^github.com/kenzok8/trojan-go/tunnel/shadowsocks$')
          go test $packages

      - name: Build
        run: go build -tags full ./...

      - name: Create maintenance pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- go.mod go.sum; then
            echo "No monthly dependency changes"
            exit 0
          fi
          branch="chore/monthly-maintenance-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add go.mod go.sum
          git commit -m "chore: monthly Go module refresh"
          git push origin "$branch"
          PR_BODY=$(printf '%s\n' \
            '## Summary' \
            '- refresh Go modules with patch-level updates' \
            '- run go mod tidy, go test ./..., and go build -tags full ./...' \
            '- monthly automated maintenance review')
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "chore: monthly Go module refresh" \
            --body "$PR_BODY"

      - name: Close superseded maintenance PRs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH="chore/monthly-maintenance-${{ github.run_id }}"
          # Only clean up when this run actually created a PR; otherwise
          # there is no newer refresh to supersede the older ones.
          if ! gh pr list --base "$BASE_BRANCH" --head "$BRANCH" --state open --json url --jq -e '.[0].url' >/dev/null; then
            echo "No PR created by this run; keeping older maintenance PRs"
            exit 0
          fi
          # Each run branches from current master and bumps to the latest deps,
          # so any older open monthly-maintenance PR is superseded by this one.
          gh pr list --base "$BASE_BRANCH" --state open --limit 50 --json number,headRefName \
            --jq -r '.[] | select(.headRefName | startswith("chore/monthly-maintenance-")) | select(.headRefName != env.BRANCH) | "\(.number) \(.headRefName)"' |
          while read -r num head; do
            [ -n "$num" ] || continue
            gh pr close "$num" --comment "Superseded by the latest monthly maintenance run ($BRANCH)." || true
            git push origin --delete "$head" || true
            echo "closed superseded PR #$num and deleted $head"
          done
